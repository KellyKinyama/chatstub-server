name: rainbow_stub
description: >-
  Wire-compatible stub of the Alcatel-Lucent Rainbow CPaaS backend
  (REST + XMPP-over-WS + Asterisk WebRTC bridge) for local development
  of react-native-rainbow-module apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  # HTTP
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1

  # Persistence — reuse the same sqlite3 dep as xmppx_server
  sqlite3: ^2.4.0

  # Config / crypto / IDs
  yaml: ^3.1.2
  crypto: ^3.0.3
  uuid: ^4.3.3
  logging: ^1.2.0
  mime: ^2.0.0
  http_parser: ^4.1.2
  xml: ^6.5.0

  # xmppx (../xmppx/) is a Dart workspace — sub-packages carry
  # `resolution: workspace` which prevents consumption via `path:`
  # from a sibling project. Phase 3 uses a hand-rolled minimal
  # XMPP-over-WS server (RFC 7395) tailored to the Rainbow SDK's
  # expectations rather than depending on xmppx_server.

  # SIP stack for the Jingle↔SIP bridge (M1+). Path deps into the
  # dart_sip workspace at c:\www\cpp\dart_sip.
  sip_core:        { path: ../../cpp/dart_sip/packages/sip_core }
  sip_transport:   { path: ../../cpp/dart_sip/packages/sip_transport }
  sip_transaction: { path: ../../cpp/dart_sip/packages/sip_transaction }
  sip_dialog:      { path: ../../cpp/dart_sip/packages/sip_dialog }
  sip_uac:         { path: ../../cpp/dart_sip/packages/sip_uac }
  sip_uas:         { path: ../../cpp/dart_sip/packages/sip_uas }
  sip_dns:         { path: ../../cpp/dart_sip/packages/sip_dns }
  sip_media:       { path: ../../cpp/dart_sip/packages/sip_media }

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
